# Configuración de la API-Gateway de EyesFood implementada con express-gateway https://www.express-gateway.io/docs/
# http contiene el puerto donde la API-Gateway escucha las requests
http:
  port: ${PORT}
  hostname: ${HOST}
admin:
  port: ${ADMIN_PORT}
  host: ${HOST}
# apiEndopoints contiene los paths asociados a cada microservicio.
# serviceEndpoints contiene la url donde se encuentra cada microservicio
apiEndpoints:
  login: 
    host: "*"
    paths: ["/auth/*", "/auth/*/*", "/activate/*"]
  ms-accounts:
    host: "*"
    paths: ["/users", "/users/*", "/experts", "/experts/*", "/stores", "/stores/*", "/roles", "/roles/*", "/permissions", "/permissions/*", "/validate-token"]
  ms-food-profile:
    host: "*"
    paths: ["/food", "/food/*", "/search", "/search/*"]
  ms-food-edits:
    host: "*"
    paths: ["/submissions", "/submissions/*", "submissions/*/*", "/submissions-food", "/submissions-food/*", 
            "/submissions-additives", "/submissions-additives/*", "/submissions-allergens", "/submissions-allergens/*",
            "/submissions-images"]
  ms-user-profile:
    host: "*"
    paths: ["/profile", "/profile/*", "/profile/*/*"]
  ms-food-diary:
    host: "*"
    paths: ["/food-diary", "/food-diary/*", "/food-diary-google/*", "/diary-entry-google/*"]
  ms-comments:
    host: "*"
    paths: ["/comments-expert/*", "/comments-store/*", "/comments-expert", "/comments-store", "/comments-food", "/comments-food/*"]
  ms-experts:
    host: "*"
    paths: ["/articles", "/articles/*", "/food-advice", "/food-advice/*", "/expert-profile", "/expert-profile/*"]
  ms-stores:
    host: "*"
    paths: ["/catalogue", "/catalogue/*", "/store-profile", "/store-profile/*"]
  ms-notification:
    host: "*"
    paths: ["/notification", "/notification/*", "/userhasnotification", "/userhasnotification/*"]
  ms-stats:
    host: "*"
    paths: ["/stats", "/stats/*", "/users-stats", "/users-stats/*"]
serviceEndpoints:
  login:
    url: ${MS_ACCOUNTS}
  ms-accounts:
    url: ${MS_ACCOUNTS}
  ms-food-profile:
    url: ${MS_FOOD_PROFILE}
  ms-user-profile:
    url: ${MS_USER_PROFILE}
  ms-food-edits:
    url: ${MS_FOOD_EDITS}
  ms-food-diary:
    url: ${MS_FOOD_DIARY}
  ms-comments:
    url: ${MS_COMMENTS}
  ms-expert-profile:
    url: ${MS_EXPERT_PROFILE}
  ms-store-profile:
    url: ${MS_STORE_PROFILE}
  ms-notifications:
    url: ${MS_NOTIFICATIONS}
  ms-stats:
    url: ${MS_STATS}
# policies contiene funcionalidades que pueden ser utilizadas para evaluar requests y realizar acciones sobre ellas
policies:
  - basic-auth
  - cors
  - expression
  - key-auth
  - log
  - oauth2
  - proxy
  - jwt
  - rate-limit
  - request-transformer
pipelines:
  login:
    apiEndpoints:
      - login
    policies:
    # cors es necesario para manejar la autenticación y autorización de usuarios a traves de jsonwebtoken
      - cors:
          - action:
              origin: true
              credentials: true
              methods: 'HEAD,PUT,PATCH,POST,DELETE,GET'
              exposedHeaders : ['allowed-custom-header']
              allowedHeaders :  ['content-type', 'Authorization', "Access-Control-Allow-Origin", "cookies", "set-cookies"]
              preflightContinue : false
              optionsSuccessStatus  : 204
      - proxy:
          - action:
              serviceEndpoint: login
              changeOrigin: true

  ms-accounts:
    apiEndpoints:
      - ms-accounts
    policies:
      - cors:
            - action:
                origin: true
                credentials: true
                methods: 'HEAD,PUT,PATCH,POST,DELETE,GET'
                exposedHeaders : ['allowed-custom-header']
                allowedHeaders :  ['content-type', 'Authorization', "Access-Control-Allow-Origin", "cookies", "set-cookies"]
                preflightContinue : false
                optionsSuccessStatus  : 204
    # jwt revisa que la jsonwebtoken que viene en el header "Authorization" de la request sea válida
    # secretOrPublicKey debe ser igual a la utilizada en el microservicio para crear la token
      - jwt:
          - action:
              secretOrPublicKey: ${JWT_SECRET}
              checkCredentialExistence: false

      - proxy:
          - action:
              serviceEndpoint: ms-accounts
              changeOrigin: true

  ms-food-profile:
